# ============================================================
# VegGo Fresh Backend — Base Application Configuration
# Active profile is set via:  SPRING_PROFILES_ACTIVE=local|dev|prod
# Each profile-specific file overrides only the values it needs.
# ============================================================
spring:
  application:
    name: veggofresh-backend

  # ── Active profile (override via env var in deployment) ───
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/veggofresh?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:veggofresh}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: VegGoFreshPool

  # ── JPA ───────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  # ── Flyway Migrations ─────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false
    out-of-order: true

  # ── Jackson ───────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ── Multipart / File Uploads ────────────────────────────────
  # Spring Boot's own default is 1MB per file / 10MB per request, which is too small
  # for KYC documents and product photo galleries. Per-file-type limits are enforced
  # on top of this by CloudinaryService (veggofresh.uploads.* below) — these two
  # servlet-level values just need to be >= the largest per-file limit we allow, plus
  # headroom for multi-image product uploads in a single request.
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:30MB}

# ── Server ────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  # Required when running behind a reverse proxy (Nginx).
  # Ensures Spring reads real IP / scheme from X-Forwarded-* headers.
  forward-headers-strategy: FRAMEWORK
  error:
    include-message: never    # Never expose raw exception messages to clients
    include-stacktrace: never

# ── VegGo Fresh Custom Properties ─────────────────────────
veggofresh:
  # ── CORS ──────────────────────────────────────────────────
  cors:
    # Comma-separated list of allowed origins.
    # In production set:  CORS_ALLOWED_ORIGINS=http://veggofresh.in,https://veggofresh.in
    # Postman does not send an Origin header so it bypasses CORS entirely — if
    # you see 403 from Postman the issue is auth (missing Bearer token), not CORS.
    allowed-origins:
      - ${CORS_ORIGIN_1:http://localhost:3000}
      - ${CORS_ORIGIN_2:http://localhost:5173}
      - ${CORS_ORIGIN_3:http://localhost:8080}
      - ${CORS_ORIGIN_4:http://veggofresh.in}
      - ${CORS_ORIGIN_5:https://veggofresh.in}
  jwt:
    # ⚠ REQUIRED: Override JWT_SECRET in all environments.
    # Generate a strong Base64-encoded key (minimum 256 bits):
    #   openssl rand -base64 32
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTdHJvbmdTZWNyZXRLZXlGb3JKV1QhMTIzNDU2Nzg5}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:43200000}      # 1 day
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days

  # ── Firebase ──────────────────────────────────────────────
  firebase:
    # Path to the Firebase Admin SDK service account JSON file.
    # Provide via FIREBASE_SERVICE_ACCOUNT_PATH env var in deployment.
    # Example: /secrets/firebase-service-account.json
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

  # ── Cloudinary ────────────────────────────────────────────
  # ⚠ REQUIRED in every environment, including local. No defaults are provided here
  # on purpose — same policy as DB_URL/DB_USERNAME/DB_PASSWORD — so nobody's real
  # Cloudinary credentials ever end up committed to git. Export these three as
  # environment variables before starting the app (IDE run config / shell env /
  # secrets manager in prod):
  #   CLOUDINARY_CLOUD_NAME
  #   CLOUDINARY_API_KEY
  #   CLOUDINARY_API_SECRET
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  # ── Upload limits (enforced by CloudinaryService, in addition to the servlet-level
  #    multipart limits above) ─────────────────────────────────
  uploads:
    image:
      # Avatars, store/category/subcategory icons, product photos. jpg/jpeg/png/webp only.
      max-size-mb: ${IMAGE_MAX_SIZE_MB:5}
    document:
      # KYC/verification documents (vendor & delivery documents, onboarding license/
      # insurance photos, proof-of-delivery). jpg/jpeg/png/webp/pdf.
      max-size-mb: ${DOCUMENT_MAX_SIZE_MB:10}

# ── SpringDoc / Swagger ───────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.veggofresh: INFO
    org.springframework.security: WARN
