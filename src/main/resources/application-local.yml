# ============================================================
# VegGo Fresh — LOCAL profile
# For developer machines running MySQL locally (e.g., via Docker Compose).
# Override individual values in your local .env file or IDE run config.
# This file is safe to commit (no secrets are hardcoded).
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/veggofresh_local
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Pearl@!@#1234}
    driver-class-name: org.postgresql.Driver     # ← Add this line (Very Important)

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true


logging:
  level:
    com.veggofresh: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
