# ============================================================
# VegGo Fresh — LOCAL profile
# For developer machines running MySQL locally (e.g., via Docker Compose).
# Override individual values in your local .env file or IDE run config.
# This file is safe to commit (no secrets are hardcoded).
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/veggofresh_local
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver     # ← Add this line (Very Important)

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration,classpath:db/migration/postgresql

logging:
  level:
    com.veggofresh: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG

veggofresh:
  # ── Razorpay ──────────────────────────────────────────────
  razorpay:
    # ⚠ Set RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET env vars in all environments.
    # Test keys start with rzp_test_, live keys start with rzp_live_
    key-id: rzp_test_TTUpC17cOLtNl8
    key-secret: 1czeynu9LP76ww3wC83jW9UX
    # Webhook secret is configured in Razorpay Dashboard → Webhooks → Secret
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}
    # payouts-enabled becomes true once Razorpay Route KYC is approved
    payouts-enabled: true
    # Platform commission % deducted from vendor settlement (e.g. 10 = 10%)
    platform-commission-percent: 10
