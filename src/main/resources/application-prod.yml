# ============================================================
# VegGo Fresh — PROD profile
# All values MUST come from environment variables or a secrets manager.
# This file intentionally contains NO default values for sensitive properties.
# ============================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  jpa:
    show-sql: false
  flyway:
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  # Disable Swagger UI in production (uncomment to hide docs from public)
  # swagger-ui:
  #   enabled: false
  # api-docs:
  #   enabled: false

veggofresh:
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:service-account.json}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:nn6v1iwx}
    api-key: ${CLOUDINARY_API_KEY:225473847594236}
    api-secret: ${CLOUDINARY_API_SECRET:WgtN1vIiMis3kLHAZWDkO28N6nM}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TTUpC17cOLtNl8}
    key-secret: ${RAZORPAY_KEY_SECRET:1czeynu9LP76ww3wC83jW9UX}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:YzT8kN2pQrX9vL4mB7wS1tR6uJ0hF3eA5cD8nK2xM4Q=}
    payouts-enabled: ${RAZORPAY_PAYOUTS_ENABLED:true}
    account-number: ${RAZORPAY_ACCOUNT_NUMBER:2323230073112811}
    platform-commission-percent: ${RAZORPAY_PLATFORM_COMMISSION_PERCENT:10}

logging:
  level:
    root: WARN
    com.veggofresh: INFO
    org.springframework.security: WARN
