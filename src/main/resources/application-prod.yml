# ============================================================
# VegGo Fresh — PROD profile
# All values MUST come from environment variables or a secrets manager.
# This file intentionally contains NO default values for sensitive properties.
# ============================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  jpa:
    show-sql: false
  flyway:
    out-of-order: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  # Disable Swagger UI in production (uncomment to hide docs from public)
  # swagger-ui:
  #   enabled: false
  # api-docs:
  #   enabled: false

logging:
  level:
    root: WARN
    com.veggofresh: INFO
    org.springframework.security: WARN
